[package]
name = "deskbox-reconstructed"
version = "0.1.0"
edition = "2021"
description = "Evidence-based reconstruction of DeskBox 0.1.0"
build = "build.rs"

[lib]
name = "deskbox_reconstructed"

[[bin]]
name = "deskbox-reconstructed"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui", "custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:windows", "dep:image", "dep:libloading", "dep:base64", "dep:windows-registry"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "=2.12.2", optional = true, features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-dialog = { version = "=2.8.1", optional = true }
tauri-plugin-autostart = { version = "=2.7.0", optional = true }
tauri-plugin-single-instance = { version = "=2.5.2", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "bmp", "ico", "webp"] }
base64 = { version = "0.22", optional = true }
libloading = { version = "0.8", optional = true }
windows-registry = { version = "0.6", optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

